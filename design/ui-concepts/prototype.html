<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>Space Runner — UI concept preview</title>
  <link rel="stylesheet" href="./prototype.css" />
</head>
<body>
  <aside class="review-bar" aria-label="Design review navigation">
    <a href="./">← Concepts</a>
    <label>Concept <select id="concept"><option value="a">A / Flight instrumentation</option><option value="b">B / Arcade racing</option><option value="c">C / Isolation minimalism</option></select></label>
    <label>Screen <select id="screen"><option value="menu">Main menu</option><option value="playing">Gameplay HUD</option><option value="paused">Pause</option><option value="over">Game over</option><option value="hit">Damage</option><option value="loading">Loading</option><option value="error">Load error</option></select></label>
    <span>DESIGN DEMO · FROZEN GAME CAPTURE</span>
  </aside>
  <main id="stage" data-concept="a" data-screen="menu" tabindex="-1" aria-label="Space Runner interface prototype">
    <picture class="scene"><source media="(max-width: 600px)" id="portrait-source" /><source media="(max-height: 520px) and (min-width: 601px)" id="landscape-source" /><img id="scene-image" alt="Actual Space Runner ship and space environment, captured on route 42." /></picture>
    <div class="shade" aria-hidden="true"></div>
    <div id="interface"></div>
    <span class="demo-caption">UI STUDY <span id="concept-letter">A</span> / RECORDED RUN</span>
    <dialog id="audio" aria-labelledby="audio-title" aria-describedby="audio-status">
      <header><h2 id="audio-title">Audio</h2><button class="text-button" id="audio-close" aria-label="Close audio settings">Close <span aria-hidden="true">×</span></button></header>
      <p id="audio-status" role="status">Preview controls only. No audio playback.</p>
      <div class="audio-channels">
        <label>Master <output id="master-value" aria-hidden="true">65%</output><input aria-label="Master volume" id="master" type="range" min="0" max="100" value="65" /></label>
        <label>Music <output id="music-value" aria-hidden="true">35%</output><input aria-label="Music volume" id="music" type="range" min="0" max="100" value="35" /></label>
        <label>Sound effects <output id="sfx-value" aria-hidden="true">75%</output><input aria-label="Sound effects volume" id="sfx" type="range" min="0" max="100" value="75" /></label>
      </div>
      <button class="secondary" id="mute" aria-pressed="false">Mute sound <kbd>M</kbd></button>
      <p class="audio-note">In the game: preferences save on this device.<br />This study changes preview values only.</p>
    </dialog>
  </main>
  <script type="module" src="./prototype.js"></script>
</body>
</html>
